[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/hal100-core",
    "crates/hal100-infra",
    "crates/hal100-platform",
    "crates/hal100-protocol",
]
resolver = "2"

[workspace.package]
version = "1.0.3"
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[workspace.dependencies]
axum = "0.8.9"
base64 = "0.22.1"
bytes = "1.12.1"
futures-util = "0.3.34"
flate2 = "1.1.9"
http-body-util = "0.1.3"
json5 = "1.3.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10.0"
sha2 = "0.10.9"
subtle = "2.6.1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-build = "2.6.3"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-autostart = "2.5.1"
tar = "0.4.44"
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = { version = "0.5", features = ["limit", "util"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
trash = "5.2.6"
uuid = { version = "1.24.1", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

# Development builds perform full multi-GB artifact verification. Keep the
# cryptographic hot loop optimized without changing debuggability of HAL100.
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
